services:
  mc189:
    image: itzg/minecraft-server:java8
    container_name: mcbotctl-server
    tty: true
    stdin_open: true
    ports:
      - "25566:25565"
    environment:
      EULA: "TRUE"
      VERSION: "1.8.8"
      TYPE: "PAPER"
      ONLINE_MODE: "FALSE"
      MEMORY: "2G"
      MAX_PLAYERS: "20"
      DIFFICULTY: "peaceful"
      MODE: "creative"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "4"
      MOTD: "mcbotctl test bed"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "mcbotctl"
    volumes:
      - ./server/data:/data
    restart: "no"
